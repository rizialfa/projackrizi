<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KERANJANG - ALFARIZI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:linear-gradient(180deg,#000,#111,#1a1a1a,#000);color:#fff;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;border-left:1px solid rgba(255,255,255,0.25);border-right:1px solid rgba(255,255,255,0.25);display:flex;flex-direction:column}
.topBar{display:flex;align-items:center;gap:10px;padding:12px;background:linear-gradient(135deg,rgba(0,0,0,0.85),rgba(60,60,60,0.65),rgba(255,255,255,0.35));border-bottom:1px solid rgba(255,255,255,0.3);position:sticky;top:0;z-index:20}
.topBar a{width:40px;height:40px;background:#fff;color:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:900;font-size:18px}
.topBar b{font-size:16px;display:block}
.topBar small{color:#ccc;letter-spacing:2px;font-size:9px}
.list{flex:1;padding:12px 10px 10px;display:flex;flex-direction:column;gap:10px}
.cartItem{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,0.55),rgba(90,90,90,0.45),rgba(0,0,0,0.75));border:1px solid rgba(255,255,255,0.35);border-radius:16px;padding:10px}
.cartItem img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid rgba(255,255,255,0.3);flex-shrink:0}
.cartItem b{font-size:13px;display:block;line-height:1.3}
.cartItem small{font-size:11px;color:#bbb}
.cartItem .harga{margin-left:auto;text-align:right}
.cartItem .harga b{font-size:13px}
.cartItem .harga button{margin-top:6px;border:none;background:#ff2222;color:#fff;padding:6px 10px;border-radius:8px;font-weight:bold;font-size:11px}
.empty{text-align:center;color:#aaa;font-size:13px;padding:40px 10px;line-height:1.6}
.foot{position:sticky;bottom:0;background:rgba(0,0,0,0.95);border-top:1px solid rgba(255,255,255,0.3);padding:14px}
.total{display:flex;justify-content:space-between;font-weight:900;font-size:16px;margin-bottom:12px}
.total span:last-child{font-size:18px}
.foot button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;font-size:15px;margin-top:8px}
.btnWA{background:#fff;color:#000}
.btnClear{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3)!important;color:#fff}
.btnLanjut{display:block;text-align:center;padding:12px;border-radius:12px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3);color:#fff;text-decoration:none;font-size:13px;font-weight:bold}
.cartForm{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.cartForm label{font-size:11px;color:#ccc}
.cartForm input,.cartForm textarea{width:100%;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;outline:none;font-size:13px}
.cartForm input::placeholder,.cartForm textarea::placeholder{color:#aaa}
.btnLangsung{background:#22c55e;color:#fff}
.suksesBox{display:none;background:#22c55e;color:#fff;border-radius:14px;padding:14px;text-align:center;font-size:13px;line-height:1.6;margin:12px 10px 0}
.suksesBox b{font-size:15px}
.suksesBox a{color:#fff;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <div class="topBar"><a href="index.html">←</a><div><small>// ALFARIZI</small><b>🛒 KERANJANG LU</b></div></div>
  <div class="suksesBox" id="suksesBox"><b>✅ ORDER TERKIRIM KE OWNER!</b><br><span id="suksesTeks"></span><br>Owner udah dapet notif-nya, tunggu owner bales ya.<br><a href="owner-chat.html">💬 Cek balesan owner di Owner Chat →</a></div>
  <div class="list" id="cartList"></div>
  <div class="foot" id="cartFoot">
    <div class="total"><span>Total:</span><span id="cartTotal">Rp 0</span></div>
    <div class="cartForm">
      <div><label>NAMA PEMBELI</label><input id="namaPembeli" placeholder="Contoh: Budi"></div>
      <div><label>ALAMAT / CATATAN</label><textarea id="alamatPembeli" rows="2" placeholder="Contoh: Jl. Merdeka No.10, Bandung - COD"></textarea></div>
    </div>
    <button class="btnWA" onclick="checkoutWA()">💬 CHECKOUT VIA WHATSAPP</button>
    <button class="btnLangsung" onclick="beliLangsung()">🚀 BELI LANGSUNG - KIRIM KE OWNER</button>
    <p style="font-size:11px;color:#aaa;text-align:center;margin-top:6px">Beli Langsung = order langsung masuk ke HP owner, tanpa buka WA. Owner bisa langsung bales lu.</p>
    <button class="btnClear" onclick="clearCart()">Hapus Semua</button>
    <a class="btnLanjut" href="index.html" style="margin-top:8px">+ Lanjut Belanja</a>
  </div>
</div>
<script>
const NPOINT_ORDER_ID = "67721059d7f24e580ead";
const NPOINT_ORDER_URL = "https://api.npoint.io/" + NPOINT_ORDER_ID;
let cart = [];
try{ cart = JSON.parse(localStorage.getItem('alfarizi_cart') || '[]'); if(!Array.isArray(cart)) cart=[]; }catch(e){ cart=[]; }
function saveCart(){ localStorage.setItem('alfarizi_cart', JSON.stringify(cart)); }
function getPembeli(){
  let nama=document.getElementById('namaPembeli') ? document.getElementById('namaPembeli').value.trim() : '';
  let alamat=document.getElementById('alamatPembeli') ? document.getElementById('alamatPembeli').value.trim() : '';
  return {nama: nama||'Pembeli', alamat};
}
function tampil(){
  let list=document.getElementById('cartList');
  let total=cart.reduce((a,b)=>a+b.harga,0);
  document.getElementById('cartTotal').innerText='Rp '+total.toLocaleString('id-ID');
  document.getElementById('cartFoot').style.display = cart.length ? 'block' : 'none';
  if(!cart.length){
    list.innerHTML=`<div class="empty">Keranjang masih kosong.<br><br><a href="index.html" style="color:#fff;font-weight:bold">← Balik ke Toko, pilih produk dulu</a></div>`;
    return;
  }
  list.innerHTML=cart.map((p,i)=>`
    <div class="cartItem">
      <img src="${p.foto}" alt="">
      <div><b>${p.nama}</b><small>${(p.kat||'').toUpperCase()} • ${p.rate||''}</small></div>
      <div class="harga"><b>Rp ${p.harga.toLocaleString('id-ID')}</b><br><button onclick="hapus(${i})">✕ Hapus</button></div>
    </div>`).join('');
}
function hapus(i){ cart.splice(i,1); saveCart(); tampil(); }
function clearCart(){ if(!confirm('Hapus semua isi keranjang?')) return; cart=[]; saveCart(); tampil(); }
async function kirimOrderKeOwner(mode){
  try{
    let total=cart.reduce((a,b)=>a+b.harga,0);
    let pb=getPembeli();
    let r=await fetch(NPOINT_ORDER_URL,{cache:'no-store'});
    let data=await r.json(); if(!Array.isArray(data)) data=[];
    let teks='👤 Pembeli: '+pb.nama+'\n'+cart.map(p=>'- '+p.nama+' (Rp '+p.harga.toLocaleString('id-ID')+')').join('\n')+'\nTotal: Rp '+total.toLocaleString('id-ID')+(pb.alamat ? '\n📍 Alamat/Catatan: '+pb.alamat : '')+(mode==='langsung' ? '\n👉 Order via BELI LANGSUNG, langsung respon pembeli ini di Owner!' : '\n👉 Cek WA lu, pembeli udah chat!');
    data.push({id:Date.now(),nama:'🛒 ORDER BARU',teks:teks,time:new Date().toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),isOrder:true});
    if(data.length>200) data=data.slice(-200);
    await fetch(NPOINT_ORDER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  }catch(e){}
}
function checkoutWA(){
  if(!cart.length){ alert('Keranjang masih kosong!'); return; }
  let total=cart.reduce((a,b)=>a+b.harga,0);
  let pb=getPembeli();
  let pesan='asalamualaikum ka, saya '+pb.nama+' mau order:%0A'+cart.map(p=>'- '+p.nama+' (Rp '+p.harga.toLocaleString('id-ID')+')').join('%0A')+'%0A%0ATotal: Rp '+total.toLocaleString('id-ID')+(pb.alamat ? '%0AAlamat: '+encodeURIComponent(pb.alamat) : '');
  kirimOrderKeOwner('wa');
  window.open('https://wa.me/62881022734231?text='+pesan,'_blank');
}
async function beliLangsung(){
  if(!cart.length){ alert('Keranjang masih kosong!'); return; }
  let total=cart.reduce((a,b)=>a+b.harga,0);
  let pb=getPembeli();
  if(!document.getElementById('namaPembeli').value.trim()){
    let n=prompt('Tulis nama lu biar owner tau siapa yang order:');
    if(n) document.getElementById('namaPembeli').value=n;
    pb=getPembeli();
  }
  await kirimOrderKeOwner('langsung');
  document.getElementById('suksesTeks').innerText=pb.nama+', total Rp '+total.toLocaleString('id-ID')+' udah terkirim.';
  document.getElementById('suksesBox').style.display='block';
  document.getElementById('suksesBox').scrollIntoView({behavior:'smooth'});
  cart=[]; saveCart(); tampil();
}
tampil();
</script>
</body>
</html>

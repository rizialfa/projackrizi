<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIZI GROUP</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
  body{background:#0f0f0f;color:#fff}
  .wrap{max-width:420px;margin:0 auto;height:100vh;background:#111;border-left:2px solid #FFD700;border-right:2px solid #FFD700;display:flex;flex-direction:column}
  header{padding:20px 15px 14px;text-align:center;background:#1a1a1a;border-bottom:3px solid #FFD700}
  header h1{color:#FFD700;font-size:30px;letter-spacing:3px}
  header p{font-size:11px;color:#aaa;margin-top:5px;letter-spacing:3px}
  .status{margin:12px 12px 0;padding:11px;text-align:center;background:#0a2a12;border:1px solid #25D366;border-radius:20px;color:#25D366;font-size:13px;font-weight:bold}
  #login{padding:15px}
  #login input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;font-size:16px;outline:none}
  #login button{width:100%;padding:14px;margin-top:12px;background:#FFD700;color:#000;font-weight:900;border:none;border-radius:12px;font-size:16px;cursor:pointer}
  #chatArea{flex:1;overflow-y:auto;padding:14px 12px;display:none;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word}
  .msg b{display:block;font-size:11px;margin-bottom:3px}
  .msg small{display:block;font-size:10px;opacity:.6;margin-top:4px;text-align:right}
  .msg.aku{align-self:flex-end;background:#FFD700;color:#000;border-bottom-right-radius:4px}
  .msg.dia{align-self:flex-start;background:#222;color:#fff;border-bottom-left-radius:4px;border:1px solid #333}
  .msg.dia b{color:#FFD700}
  .msg.sys{align-self:center;background:#1a1a1a;color:#888;font-size:12px;padding:6px 12px;border-radius:20px}
  #inputBar{display:none;padding:10px;background:#1a1a1a;border-top:1px solid #333;gap:8px;align-items:center}
  #inputBar input{flex:1;padding:12px 14px;border-radius:25px;border:1px solid #333;background:#222;color:#fff;outline:none;font-size:14px}
  #inputBar button{width:46px;height:46px;border-radius:50%;background:#FFD700;border:none;font-size:20px;cursor:pointer}
  .share{padding:10px 12px}
  .share button{width:100%;padding:12px;background:#25D366;color:#fff;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
  footer{text-align:center;padding:8px;color:#555;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>RIZI GROUP</h1><p>CHAT BARENG • TANPA NO HP</p></header>
  <div class="status">● GRUP AKTIF • <span id="online">MENYAMBUNG KE SERVER...</span></div>
  <div id="login">
    <input type="text" id="nama" placeholder="Nama kamu... Contoh: Rizi">
    <button onclick="masuk()">MASUK GRUP ➜</button>
    <p style="text-align:center;color:#666;font-size:11px;margin-top:10px">Server: Gun Public • Gratis • Tanpa Daftar</p>
  </div>
  <div id="chatArea"></div>
  <div id="inputBar">
    <input type="text" id="pesan" placeholder="Ketik pesan...">
    <button onclick="kirim()">➤</button>
  </div>
  <div class="share"><button onclick="shareLink()">📤 BAGIKAN LINK KE TEMEN</button></div>
  <footer>© 2026 RIZI GROUP • Server Numpang • Tampilan Punya Rizi</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script>
// INI SERVER-NYA, UDAH GUE SIAPIN, LU TINGGAL PAKE
const gun = Gun({
  peers: [
    'https://peer.wallie.io/gun',
    'https://gun-manhattan.herokuapp.com/gun',
    'https://european-gun.129.213.59.136.nip.io/gun'
  ]
});
const chat = gun.get('rizi-group-v3-chat');

let namaSaya = localStorage.getItem('rizi_nama') || '';
if(namaSaya) document.getElementById('nama').value = namaSaya;
let udahTampil = new Set();

function masuk(){
  let n = document.getElementById('nama').value.trim();
  if(!n){ alert('Isi nama dulu!'); return; }
  namaSaya = n; localStorage.setItem('rizi_nama', n);
  document.getElementById('login').style.display='none';
  document.getElementById('chatArea').style.display='flex';
  document.getElementById('inputBar').style.display='flex';
  document.getElementById('online').innerText = 'TERHUBUNG';
  kirimSystem(n + ' masuk grup');
  document.getElementById('pesan').focus();
}
function kirim(){
  let inp = document.getElementById('pesan');
  let teks = inp.value.trim();
  if(!teks) return;
  chat.set({nama: namaSaya, pesan: teks, waktu: Date.now(), id: Date.now() + '_' + Math.random()});
  inp.value=''; inp.focus();
}
function kirimSystem(teks){
  chat.set({nama:'SYSTEM', pesan: teks, waktu: Date.now(), id: Date.now() + '_' + Math.random(), sys:true});
}
document.getElementById('pesan').addEventListener('keydown', e=>{ if(e.key==='Enter') kirim(); });
document.getElementById('nama').addEventListener('keydown', e=>{ if(e.key==='Enter') masuk(); });

chat.map().on((data, key)=>{
  if(!data || !data.pesan) return;
  if(udahTampil.has(key)) return;
  udahTampil.add(key);
  // Cuma tampilin kalo udah masuk
  if(!namaSaya && !data.sys) return;
  let area = document.getElementById('chatArea');
  let div = document.createElement('div');
  if(data.sys){ div.className='msg sys'; div.innerText=data.pesan; }
  else{
    let aku = data.nama===namaSaya;
    div.className='msg '+(aku?'aku':'dia');
    let jam = new Date(data.waktu).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    div.innerHTML = '<b>'+data.nama+'</b>'+data.pesan+'<small>'+jam+'</small>';
  }
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
});

function shareLink(){
  let teks = 'Gabung RIZI GROUP! Chat bareng: ' + window.location.href;
  if(navigator.share) navigator.share({text: teks});
  else { navigator.clipboard.writeText(teks); alert('Link ke-copy!'); }
}
</script>
</body>
</html>

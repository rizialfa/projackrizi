<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIZI GROUP</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
  body{background:#0f0f0f;color:#fff}
  .wrap{max-width:420px;margin:0 auto;height:100vh;background:#111;border-left:2px solid #FFD700;border-right:2px solid #FFD700;display:flex;flex-direction:column;overflow:hidden}
  header{padding:20px 15px 14px;text-align:center;background:#1a1a1a;border-bottom:3px solid #FFD700;flex-shrink:0}
  header h1{color:#FFD700;font-size:30px;letter-spacing:3px}
  header p{font-size:11px;color:#aaa;margin-top:5px;letter-spacing:3px}
  .status{margin:12px 12px 0;padding:11px;text-align:center;background:#0a2a12;border:1px solid #25D366;border-radius:20px;color:#25D366;font-size:13px;font-weight:bold;flex-shrink:0}
  #login{padding:15px}
  #login input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;font-size:16px;outline:none}
  #login button{width:100%;padding:14px;margin-top:12px;background:#FFD700;color:#000;font-weight:900;border:none;border-radius:12px;font-size:16px;cursor:pointer}
  #chatArea{flex:1;overflow-y:auto;padding:14px 12px;display:none;flex-direction:column;gap:10px;background:#111}
  .msg{max-width:80%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word;animation:muncul .2s}
  @keyframes muncul{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  .msg b{display:block;font-size:11px;margin-bottom:3px}
  .msg small{display:block;font-size:10px;opacity:.6;margin-top:4px;text-align:right}
  .msg.aku{align-self:flex-end;background:#FFD700;color:#000;border-bottom-right-radius:4px}
  .msg.dia{align-self:flex-start;background:#222;color:#fff;border-bottom-left-radius:4px;border:1px solid #333}
  .msg.dia b{color:#FFD700}
  .msg.sys{align-self:center;background:#1a1a1a;color:#888;font-size:12px;padding:6px 12px;border-radius:20px;text-align:center}
  #inputBar{display:none;padding:10px;background:#1a1a1a;border-top:1px solid #333;gap:8px;align-items:center;flex-shrink:0}
  #inputBar input{flex:1;padding:12px 14px;border-radius:25px;border:1px solid #333;background:#222;color:#fff;outline:none;font-size:14px}
  #inputBar button{width:46px;height:46px;border-radius:50%;background:#FFD700;border:none;font-size:20px;cursor:pointer;flex-shrink:0}
  .share{padding:10px 12px;flex-shrink:0}
  .share button{width:100%;padding:12px;background:#25D366;color:#fff;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
  footer{text-align:center;padding:8px;color:#555;font-size:11px;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>RIZI GROUP</h1><p>CHAT BARENG • TANPA NO HP</p></header>
  <div class="status">● GRUP AKTIF - FIREBASE • <span id="online">MENYAMBUNG...</span></div>

  <div id="login">
    <input type="text" id="nama" placeholder="Nama kamu... Contoh: Rizi">
    <button onclick="masuk()">MASUK GRUP ➜</button>
    <p style="text-align:center;color:#666;font-size:11px;margin-top:10px">Server: Firebase • Chat kesimpen, gak ilang</p>
  </div>

  <div id="chatArea"></div>

  <div id="inputBar">
    <input type="text" id="pesan" placeholder="Ketik pesan...">
    <button onclick="kirim()">➤</button>
  </div>

  <div class="share"><button onclick="shareLink()">📤 BAGIKAN LINK KE TEMEN</button></div>
  <footer>© 2026 RIZI GROUP • Buatan Rizi • Firebase</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
// SERVER DEMO FIREBASE - BUAT COBA-COBA DULU
const firebaseConfig = {
  apiKey: "AIzaSyB4yJkQv3XzQwYvJqKzQv3XzQwYvJqKzQv3",
  authDomain: "rizi-group-demo.firebaseapp.com",
  databaseURL: "https://rizi-group-demo-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rizi-group-demo",
  storageBucket: "rizi-group-demo.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abcd1234efgh5678"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const chatRef = db.ref('rizi-group/chat');

let namaSaya = localStorage.getItem('rizi_nama') || '';
if(namaSaya) document.getElementById('nama').value = namaSaya;

function masuk(){
  let n = document.getElementById('nama').value.trim();
  if(!n){ alert('Isi nama dulu!'); return; }
  namaSaya = n; localStorage.setItem('rizi_nama', n);
  document.getElementById('login').style.display='none';
  document.getElementById('chatArea').style.display='flex';
  document.getElementById('inputBar').style.display='flex';
  chatRef.push({nama:'SYSTEM', pesan: n + ' masuk grup', waktu: Date.now(), sys:true});
  document.getElementById('pesan').focus();
}
function kirim(){
  let inp = document.getElementById('pesan');
  let teks = inp.value.trim();
  if(!teks) return;
  chatRef.push({nama: namaSaya, pesan: teks, waktu: Date.now()});
  inp.value=''; inp.focus();
}
document.getElementById('pesan').addEventListener('keydown', e=>{ if(e.key==='Enter') kirim(); });
document.getElementById('nama').addEventListener('keydown', e=>{ if(e.key==='Enter') masuk(); });

chatRef.limitToLast(100).on('child_added', snap=>{
  let d = snap.val();
  let area = document.getElementById('chatArea');
  let div = document.createElement('div');
  if(d.sys){ div.className='msg sys'; div.innerText=d.pesan; }
  else{
    let aku = d.nama===namaSaya;
    div.className='msg '+(aku?'aku':'dia');
    let jam = new Date(d.waktu).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    div.innerHTML = '<b>'+d.nama+'</b>'+d.pesan+'<small>'+jam+'</small>';
  }
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
});

// STATUS ONLINE
db.ref('.info/connected').on('value', s=>{
  document.getElementById('online').innerText = s.val() ? 'TERHUBUNG' : 'OFFLINE';
});

function shareLink(){
  let link = window.location.href;
  let teks = 'Gabung RIZI GROUP! Chat bareng, tampilan baru: ' + link;
  if(navigator.share) navigator.share({text: teks});
  else { navigator.clipboard.writeText(teks); alert('Link ke-copy!'); }
}
</script>
</body>
</html>
